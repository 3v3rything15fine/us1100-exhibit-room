<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presenter Deck — Whose Formula Is This?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #F7F1E7;
    --paper-dark: #EFE1D0;
    --ink: #2B2118;
    --ink-soft: #6E6153;
    --brown: #674A40;
    --teal: #50A3A4;
    --gold: #FCAF38;
    --alarm: #F95335;
    --line: #DFCFBB;
    --seg-class: #674A40;
    --seg-study: #FCAF38;
    --seg-job: #8C5FB0;
    --seg-commute: #B98255;
    --seg-chores: #50A3A4;
    --seg-sleep: #3E5C76;
    --seg-free: #7E9B5D;
    --serif: 'Source Serif 4', Georgia, serif;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
    --sans: 'Inter', system-ui, -apple-system, sans-serif;
    --radius: 18px;
    --radius-sm: 10px;
  }
  *{ box-sizing: border-box; }
  html, body{ height: 100%; }
  body{
    margin:0; background: var(--brown); color: var(--paper);
    font-family: var(--sans); line-height: 1.5; -webkit-font-smoothing: antialiased;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px;
  }

  .offline-note{
    position: fixed; top: 12px; left: 12px; z-index: 30;
    font-family: var(--mono); font-size: 11px; color: #E8C9A8;
    background: rgba(0,0,0,0.25); padding: 6px 10px; border-radius: 999px;
    max-width: 260px;
  }

  .slide-deck{
    width: 100%; max-width: 900px;
    background: var(--ink); color: var(--paper);
    border-radius: var(--radius);
    box-shadow: 0 12px 40px rgba(0,0,0,0.35);
    padding: 48px 48px 28px;
    display: flex; flex-direction: column;
    min-height: 560px;
  }
  .slide-deck:fullscreen{
    max-width: 100vw; width: 100vw; height: 100vh; min-height: 100vh;
    border-radius: 0; justify-content: center;
  }

  .slide-body{ flex: 1; display: flex; flex-direction: column; justify-content: center; }

  .kicker-dark{
    font-family: var(--mono); font-size: 13px; letter-spacing: 0.05em;
    color: var(--gold); margin: 0 0 14px;
  }
  .slide-title{
    font-family: var(--serif); font-weight: 600;
    font-size: clamp(26px, 4.4vw, 42px); margin: 0 0 20px; line-height: 1.15;
  }
  .slide-deck:fullscreen .slide-title{ font-size: clamp(34px, 5.5vw, 58px); }
  .slide-body-text{
    font-size: clamp(16px, 2vw, 19px); color: #E7DCCB; max-width: 68ch; margin: 0 0 8px;
  }
  .slide-deck:fullscreen .slide-body-text{ font-size: clamp(20px, 2.4vw, 26px); max-width: 80ch; }

  .exhibit-row{
    display: flex; gap: 32px; align-items: flex-start; flex-wrap: wrap; margin-top: 24px;
  }
  .exhibit-row[hidden]{ display: none; }
  .qr-panel{
    background: #FBF6EC; padding: 14px; border-radius: var(--radius-sm);
    box-shadow: 0 4px 14px rgba(0,0,0,0.25); flex: 0 0 auto;
  }
  .qr-panel svg{ display: block; }
  .qr-caption{
    font-family: var(--mono); font-size: 11px; color: var(--ink-soft);
    text-align: center; margin-top: 8px; max-width: 160px;
  }
  .demo-panel{
    flex: 1 1 320px; background: #35281F; border: 2px solid var(--gold);
    border-radius: var(--radius-sm); padding: 18px; min-width: 280px;
  }
  .demo-label{
    font-family: var(--mono); font-size: 11px; color: var(--gold);
    letter-spacing: 0.04em; margin: 0 0 12px;
  }

  /* Exhibit A demo: sample tool cards */
  .demo-cards{ display: grid; gap: 10px; }
  button.demo-card{
    text-align: left; font-family: var(--sans); background: #45362B;
    border: 2px solid #5C493B; border-left: 8px solid #5C493B;
    border-radius: var(--radius-sm); padding: 10px 12px; cursor: pointer; color: var(--paper);
    transition: border-color .15s ease, background .15s ease;
  }
  button.demo-card .name{ font-weight: 600; display:block; font-size: 14px; }
  button.demo-card .state{ display:block; margin-top: 4px; font-family: var(--mono); font-size: 10.5px; color: #C9B8A4; }
  button.demo-card[data-state="assumes"]{ border-left-color: var(--teal); background: #2E4A4A; }
  button.demo-card[data-state="teaches"]{ border-left-color: var(--gold); background: #4A3B1F; }

  /* Exhibit B demo */
  .demo-toggle{ display: flex; border: 2px solid var(--gold); border-radius: 999px; overflow: hidden; width: fit-content; margin-bottom: 12px; }
  .demo-toggle button{
    font-family: var(--mono); font-size: 12px; padding: 7px 14px; background: #35281F;
    border: none; cursor: pointer; color: var(--paper); border-right: 2px solid var(--gold);
  }
  .demo-toggle button:last-child{ border-right: none; }
  .demo-toggle button[aria-pressed="true"]{ background: var(--gold); color: var(--ink); }
  .demo-disruption{ display:flex; align-items:center; gap: 8px; font-family: var(--mono); font-size: 12px; margin-bottom: 12px; cursor: pointer; color: #E7DCCB; }
  .demo-number{ font-family: var(--serif); font-size: 34px; font-weight: 700; margin: 0; }
  .demo-number-label{ font-family: var(--mono); font-size: 10.5px; color: #C9B8A4; margin: 2px 0 10px; }
  .demo-bar{ display:flex; width: 100%; height: 28px; border-radius: 6px; overflow: hidden; margin-bottom: 4px; }
  .demo-bar .seg{ height: 100%; }

  /* Exhibit C demo */
  .demo-quote{
    font-family: var(--serif); font-size: clamp(17px, 2.4vw, 22px); line-height: 1.4;
    margin: 0; color: var(--paper);
  }
  .demo-cite{ font-family: var(--mono); font-size: 11px; color: #C9B8A4; margin-top: 10px; }

  .slide-nav{
    display: flex; align-items: center; gap: 12px; margin-top: 28px;
    padding-top: 18px; border-top: 1px solid #4A3B2F;
  }
  .slide-nav button{
    font-family: var(--mono); font-size: 13px; padding: 9px 18px;
    background: transparent; border: 2px solid #6B5849; color: var(--paper);
    border-radius: 999px; cursor: pointer;
  }
  .slide-nav button:hover{ border-color: var(--gold); }
  .slide-nav button:disabled{ opacity: .35; cursor: not-allowed; }
  .slide-nav .fullscreen-btn{ border-color: var(--gold); color: var(--gold); }
  .slide-nav .slide-count{ font-family: var(--mono); font-size: 12px; color: #C9B8A4; margin-left: auto; }

  @media (prefers-reduced-motion: reduce){ *{ transition: none !important; } }
</style>
</head>
<body>

<p class="offline-note">Live-sync backend is offline today — pacing works by handing out each exhibit's QR/link, not a shared control panel.</p>

<div class="slide-deck" id="slide-deck">
  <div class="slide-body">
    <p class="kicker-dark" id="s-kicker"></p>
    <h1 class="slide-title" id="s-title"></h1>
    <p class="slide-body-text" id="s-body"></p>
    <div class="exhibit-row" id="s-exhibit" hidden>
      <div class="qr-panel">
        <svg id="s-qr" width="150" height="150"></svg>
        <p class="qr-caption" id="s-qr-caption"></p>
      </div>
      <div class="demo-panel">
        <p class="demo-label" id="s-demo-label"></p>
        <div id="s-demo-mount"></div>
      </div>
    </div>
  </div>
  <div class="slide-nav">
    <button type="button" id="s-prev">&larr; Prev</button>
    <button type="button" id="s-next">Next &rarr;</button>
    <button type="button" class="fullscreen-btn" id="s-fullscreen">Present full-screen</button>
    <span class="slide-count" id="s-count"></span>
  </div>
</div>

<script src="/qrcode-lib.js"></script>
<script>
(function(){
  var SLIDES = [
    {
      type: 'text',
      kicker: 'WARM-UP · 1 OF 7',
      title: 'Before we open the tools…',
      body: 'Module 3 gave you six note-taking methods, a 5-day exam plan, a 168-hour weekly grid, and a list of campus resources. All of it assumes something about who’s reading it. Let’s name the lens we’re using today before we go looking for that.'
    },
    {
      type: 'text',
      kicker: 'THE BANKING MODEL',
      title: 'Knowledge as a deposit',
      body: 'Freire’s term for education that treats the student as an empty container and the teacher — or the module — as the one depositing the "right" technique in. The technique is framed as neutral and universal: it’s supposed to work the same for everyone, because it quietly assumes everyone starts from the same place.'
    },
    {
      type: 'text',
      kicker: 'THE ALTERNATIVE',
      title: 'Liberatory / problem-posing education',
      body: 'Freire’s alternative: student and teacher investigate together. A "best practice" isn’t a deposit to accept — it’s a claim to test against your actual conditions. Your week. Your job. Your schooling before this class. Does the rule hold, or does it only hold for whoever it was built around?'
    },
    {
      type: 'text',
      kicker: 'HOW TODAY WORKS',
      title: 'One exhibit at a time',
      body: 'The next three slides each have a QR code — scan it when I say go, not before. Work through it with your table, then wait here for the next code. Each slide also has a live demo so you can see the mechanic before you touch your own phone.'
    },
    {
      type: 'exhibit',
      kicker: 'EXHIBIT A',
      title: 'Sort the tools',
      body: 'Scan when ready. Tap a card to cycle it through unsorted → assumes → teaches — try it below first.',
      url: '/',
      demo: 'a'
    },
    {
      type: 'exhibit',
      kicker: 'EXHIBIT B',
      title: 'Stress-test the calendar',
      body: 'Scan when ready. Toggle the profile and the disruption checkbox below to see how the 168 hours move.',
      url: '/exhibit-b.html',
      demo: 'b'
    },
    {
      type: 'exhibit',
      kicker: 'EXHIBIT C',
      title: 'The fine print',
      body: 'Scan when ready.',
      url: '/exhibit-c.html',
      demo: 'c'
    }
  ];

  var idx = 0;

  function absoluteUrl(path){ return location.origin + path; }

  function renderQr(text, svg){
    try {
      var qr = qrcode(0, 'M');
      qr.addData(text);
      qr.make();
      svg.outerHTML = qr.createSvgTag(4, 8).replace('<svg', '<svg id="s-qr"');
    } catch(e) {
      svg.outerHTML = '<p style="font-family:var(--mono);font-size:11px" id="s-qr">(QR failed — share the link)</p>';
    }
  }

  // ---------- Exhibit A demo: tap-to-cycle sample cards ----------
  function mountDemoA(root){
    var samples = [
      { id:'cornell', name:'Cornell Notes' },
      { id:'outline', name:'Outline Method' },
      { id:'fixedcal', name:'Fixed-Commitment Calendar' }
    ];
    var states = {};
    var grid = document.createElement('div');
    grid.className = 'demo-cards';
    samples.forEach(function(s){
      states[s.id] = null;
      var btn = document.createElement('button');
      btn.className = 'demo-card';
      btn.type = 'button';
      btn.innerHTML = '<span class="name">' + s.name + '</span><span class="state">tap to sort</span>';
      btn.addEventListener('click', function(){
        var order = [null, 'assumes', 'teaches'];
        var next = order[(order.indexOf(states[s.id]) + 1) % order.length];
        states[s.id] = next;
        btn.dataset.state = next || '';
        btn.querySelector('.state').textContent = next === 'assumes' ? 'assumes you already know' : next === 'teaches' ? 'teaches something new' : 'tap to sort';
      });
      grid.appendChild(btn);
    });
    root.appendChild(grid);
  }

  // ---------- Exhibit B demo: profile toggle + bar ----------
  function mountDemoB(root){
    var PROFILES = {
      control: { label: 'Control', cls: 15, job: 0, commute: 0, chores: 14, sleepBase: 56 },
      real: { label: 'Real', cls: 13, job: 32, commute: 10, chores: 14, sleepBase: 49 }
    };
    var current = 'control';
    var disruption = false;

    var toggle = document.createElement('div');
    toggle.className = 'demo-toggle';
    var btnControl = document.createElement('button');
    btnControl.textContent = 'Control Student';
    btnControl.setAttribute('aria-pressed', 'true');
    var btnReal = document.createElement('button');
    btnReal.textContent = 'Real Student';
    btnReal.setAttribute('aria-pressed', 'false');
    toggle.appendChild(btnControl);
    toggle.appendChild(btnReal);

    var disruptionLabel = document.createElement('label');
    disruptionLabel.className = 'demo-disruption';
    var disruptionInput = document.createElement('input');
    disruptionInput.type = 'checkbox';
    disruptionLabel.appendChild(disruptionInput);
    disruptionLabel.appendChild(document.createTextNode('Something comes up (+12 hrs)'));

    var num = document.createElement('p');
    num.className = 'demo-number';
    var numLabel = document.createElement('p');
    numLabel.className = 'demo-number-label';
    numLabel.textContent = 'HOURS LEFT OF 168';

    var bar = document.createElement('div');
    bar.className = 'demo-bar';

    root.appendChild(toggle);
    root.appendChild(disruptionLabel);
    root.appendChild(num);
    root.appendChild(numLabel);
    root.appendChild(bar);

    var SEG_COLORS = {
      cls: getComputedStyle(document.documentElement).getPropertyValue('--seg-class').trim(),
      job: getComputedStyle(document.documentElement).getPropertyValue('--seg-job').trim(),
      commute: getComputedStyle(document.documentElement).getPropertyValue('--seg-commute').trim(),
      chores: getComputedStyle(document.documentElement).getPropertyValue('--seg-chores').trim(),
      sleep: getComputedStyle(document.documentElement).getPropertyValue('--seg-sleep').trim(),
      study: getComputedStyle(document.documentElement).getPropertyValue('--seg-study').trim(),
      free: getComputedStyle(document.documentElement).getPropertyValue('--seg-free').trim()
    };

    function compute(){
      var p = PROFILES[current];
      var extra = disruption ? 12 : 0;
      var study = p.cls * 2.5;
      var sleep = p.sleepBase;
      var fixed = p.cls + p.job + p.commute + p.chores + sleep + extra;
      var free = 168 - fixed;
      var leftover = free - study;
      var borrowed = 0;
      if(leftover < 0){
        var floor = 28;
        var available = sleep - floor;
        borrowed = Math.max(0, Math.min(available, -leftover));
        sleep -= borrowed;
        leftover += borrowed;
      }
      return { cls: p.cls, job: p.job, commute: p.commute, chores: p.chores, sleep: sleep, study: study, leftover: Math.max(leftover, 0) };
    }

    function render(){
      btnControl.setAttribute('aria-pressed', current === 'control');
      btnReal.setAttribute('aria-pressed', current === 'real');
      var r = compute();
      num.textContent = Math.round(r.leftover * 10) / 10;
      bar.innerHTML = '';
      var order = [['cls','cls'],['job','job'],['commute','commute'],['chores','chores'],['sleep','sleep'],['study','study'],['leftover','free']];
      order.forEach(function(pair){
        var val = r[pair[0]];
        if(val <= 0) return;
        var seg = document.createElement('div');
        seg.className = 'seg';
        seg.style.width = (val / 168 * 100) + '%';
        seg.style.background = SEG_COLORS[pair[1]];
        bar.appendChild(seg);
      });
    }

    btnControl.addEventListener('click', function(){ current = 'control'; render(); });
    btnReal.addEventListener('click', function(){ current = 'real'; render(); });
    disruptionInput.addEventListener('change', function(){ disruption = disruptionInput.checked; render(); });

    render();
  }

  // ---------- Exhibit C demo: the quote, large ----------
  function mountDemoC(root){
    var q = document.createElement('p');
    q.className = 'demo-quote';
    q.textContent = '"Any time a professor willingly gives you an advantage in a course, use it!"';
    var cite = document.createElement('p');
    cite.className = 'demo-cite';
    cite.textContent = '— this week’s Note-Taking handout';
    root.appendChild(q);
    root.appendChild(cite);
  }

  function renderSlide(){
    var s = SLIDES[idx];
    document.getElementById('s-kicker').textContent = s.kicker;
    document.getElementById('s-title').textContent = s.title;
    document.getElementById('s-body').textContent = s.body;
    document.getElementById('s-count').textContent = (idx + 1) + ' / ' + SLIDES.length;
    document.getElementById('s-prev').disabled = idx === 0;
    document.getElementById('s-next').disabled = idx === SLIDES.length - 1;

    var exhibitRow = document.getElementById('s-exhibit');
    var mount = document.getElementById('s-demo-mount');
    mount.innerHTML = '';

    if(s.type === 'exhibit'){
      exhibitRow.hidden = false;
      var qrSvg = document.createElement('svg');
      qrSvg.id = 's-qr';
      document.getElementById('s-qr').replaceWith(qrSvg);
      renderQr(absoluteUrl(s.url), qrSvg);
      document.getElementById('s-qr-caption').textContent = absoluteUrl(s.url).replace(/^https?:\/\//, '');
      document.getElementById('s-demo-label').textContent = 'Try it — live demo';
      if(s.demo === 'a') mountDemoA(mount);
      else if(s.demo === 'b') mountDemoB(mount);
      else if(s.demo === 'c') mountDemoC(mount);
    } else {
      exhibitRow.hidden = true;
    }
  }

  document.getElementById('s-prev').addEventListener('click', function(){
    if(idx > 0){ idx--; renderSlide(); }
  });
  document.getElementById('s-next').addEventListener('click', function(){
    if(idx < SLIDES.length - 1){ idx++; renderSlide(); }
  });
  document.getElementById('s-fullscreen').addEventListener('click', function(){
    var el = document.getElementById('slide-deck');
    if(el.requestFullscreen) el.requestFullscreen().catch(function(){});
  });
  document.addEventListener('keydown', function(e){
    if(e.key === 'ArrowRight') document.getElementById('s-next').click();
    if(e.key === 'ArrowLeft') document.getElementById('s-prev').click();
  });

  renderSlide();
})();
</script>

</body>
</html>
